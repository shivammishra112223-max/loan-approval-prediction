<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Approval Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg p-4">

<h2 class="text-center text-primary mb-4">
Loan Approval Prediction
</h2>

<form action="/predict" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Number of Dependents
</label>

<input
type="number"
class="form-control"
name="no_of_dependents"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Education
</label>

<select
class="form-select"
name="education">

<option value="1">
Graduate
</option>

<option value="0">
Not Graduate
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Self Employed
</label>

<select
class="form-select"
name="self_employed">

<option value="1">
Yes
</option>

<option value="0">
No
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Annual Income
</label>

<input
type="number"
class="form-control"
name="income_annum"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Loan Amount
</label>

<input
type="number"
class="form-control"
name="loan_amount"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Loan Term
</label>

<input
type="number"
class="form-control"
name="loan_term"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
CIBIL Score
</label>

<input
type="number"
class="form-control"
name="cibil_score"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Residential Assets
</label>

<input
type="number"
class="form-control"
name="residential_assets_value"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Commercial Assets
</label>

<input
type="number"
class="form-control"
name="commercial_assets_value"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Luxury Assets
</label>

<input
type="number"
class="form-control"
name="luxury_assets_value"
required>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">
Bank Assets
</label>

<input
type="number"
class="form-control"
name="bank_asset_value"
required>

</div>

<div class="col-md-12">

<button
type="submit"
class="btn btn-primary w-100">

Predict Loan

</button>

</div>

</div>

</form>

{% if prediction %}

<div class="mt-4">

{% if prediction=="Loan Approved" %}

<div class="alert alert-success text-center">

<h4>

✅ {{ prediction }}

</h4>

<p><strong>Probability:</strong> {{ probability }}%</p>

<p><strong>Confidence:</strong> {{ confidence }}</p>

<p><strong>Status:</strong> Prediction Successful</p>

{% else %}

<div class="alert alert-danger text-center">

<h4>

❌ Loan Rejected

</h4>

</div>

{% endif %}

</div>

{% endif %}

</div>

</div>

</div>

</div>

</body>
</html>
